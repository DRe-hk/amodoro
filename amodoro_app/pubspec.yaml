name: amodoro_app
description: "amodoro — espacio compartido en pareja"
publish_to: "none"
version: 1.7.0+10

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2785.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/google_fonts/
