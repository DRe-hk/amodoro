name: Build Amodoro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate platform directories, configure Firebase, Share Intent, Manifest & Coral "a" icon
        working-directory: amodoro_app
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p assets/avatars
          flutter create . --project-name amodoro_app --org com.amodoro --platforms android,ios,web
          pip3 install --quiet Pillow
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/playwriteustradguides/PlaywriteUSTradGuides-Regular.ttf" -o /tmp/PlaywriteUSTradGuides-Regular.ttf
          python3 - << 'PY'
          import os
          import re
          import shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          # 0. Write or copy google-services.json into android/app/google-services.json
          gs_secret = os.environ.get("GOOGLE_SERVICES_JSON_SECRET", "").strip()
          gs_src = Path("android/google-services.json")
          gs_dst = Path("android/app/google-services.json")
          if gs_secret:
              gs_dst.parent.mkdir(parents=True, exist_ok=True)
              gs_dst.write_text(gs_secret, encoding="utf-8")
              print("Injected google-services.json from GitHub Secrets into android/app/google-services.json")
          elif gs_src.exists():
              gs_dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(gs_src, gs_dst)
              print("Copied android/google-services.json -> android/app/google-services.json")
          else:
              raise FileNotFoundError("Missing google-services.json (not found in secrets or android/google-services.json)")

          # 1. Configure Gradle for Google Services (4.5.0) and Firebase BoM (35.1.0) + minSdk 23
          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          if settings_kts.exists():
              s_txt = settings_kts.read_text()
              if "com.google.gms.google-services" not in s_txt:
                  s_txt = s_txt.replace(
                      'id("com.android.application")',
                      'id("com.google.gms.google-services") version "4.5.0" apply false\n    id("com.android.application")',
                      1,
                  )
                  settings_kts.write_text(s_txt)
                  print("Updated android/settings.gradle.kts with google-services 4.5.0")
          elif settings_groovy.exists():
              s_txt = settings_groovy.read_text()
              if "com.google.gms.google-services" not in s_txt:
                  s_txt = s_txt.replace(
                      'id "com.android.application"',
                      'id "com.google.gms.google-services" version "4.5.0" apply false\n    id "com.android.application"',
                      1,
                  )
                  settings_groovy.write_text(s_txt)
                  print("Updated android/settings.gradle with google-services 4.5.0")

          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")
          if app_kts.exists():
              a_txt = app_kts.read_text()
              if "com.google.gms.google-services" not in a_txt:
                  a_txt = a_txt.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\n    id("com.google.gms.google-services")',
                      1,
                  )
              a_txt = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', a_txt)
              if "firebase-bom" not in a_txt:
                  a_txt += '\ndependencies {\n    implementation(platform("com.google.firebase:firebase-bom:35.1.0"))\n}\n'
              app_kts.write_text(a_txt)
              print("Updated android/app/build.gradle.kts")
          elif app_groovy.exists():
              a_txt = app_groovy.read_text()
              if "com.google.gms.google-services" not in a_txt:
                  a_txt = a_txt.replace(
                      'id "com.android.application"',
                      'id "com.android.application"\n    id "com.google.gms.google-services"',
                      1,
                  )
              a_txt = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', a_txt)
              a_txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', a_txt)
              if "firebase-bom" not in a_txt:
                  a_txt += "\ndependencies {\n    implementation platform('com.google.firebase:firebase-bom:35.1.0')\n}\n"
              app_groovy.write_text(a_txt)
              print("Updated android/app/build.gradle")

          # 2. Update AndroidManifest.xml (HTTPS only, allowBackup=false, permissions, Share Intent)
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          txt = manifest_path.read_text()
          if 'xmlns:android' not in txt:
              txt = txt.replace("<manifest", '<manifest\n    xmlns:android="http://schemas.android.com/apk/res/android"', 1)

          txt = re.sub(r'android:label="[^"]*"', 'android:label="amodoro"', txt)
          txt = re.sub(r'\s*android:usesCleartextTraffic="true"', '', txt)

          permissions_block = """<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
              </queries>"""

          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", f"{permissions_block}\n    <application", 1)
          if "android:allowBackup" not in txt:
              txt = txt.replace("<application", '<application\n        android:allowBackup="false"', 1)

          share_intent_block = """            <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>"""
          if "android.intent.action.SEND" not in txt:
              txt = txt.replace("</activity>", share_intent_block, 1)

          manifest_path.write_text(txt)
          print("Updated AndroidManifest.xml:")
          print(txt)

          # 3. Write MainActivity.kt with MethodChannel("com.amodoro/share") for ACTION_SEND
          kt_files = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if kt_files:
              main_kt = kt_files[0]
              main_kt.write_text("""package com.amodoro.amodoro_app

          import android.content.Intent
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.amodoro/share"
              private var initialSharedText: String? = null
              private var methodChannel: MethodChannel? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleSendIntent(intent, isInitial = true)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleSendIntent(intent, isInitial = false)
              }

              private fun handleSendIntent(intent: Intent?, isInitial: Boolean) {
                  if (intent?.action == Intent.ACTION_SEND && intent.type == "text/plain") {
                      val sharedText = intent.getStringExtra(Intent.EXTRA_TEXT)
                      if (!sharedText.isNullOrBlank()) {
                          if (isInitial && methodChannel == null) {
                              initialSharedText = sharedText
                          } else {
                              methodChannel?.invokeMethod("onSharedText", sharedText)
                          }
                      }
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel = channel
                  channel.setMethodCallHandler { call, result ->
                      if (call.method == "getInitialSharedText") {
                          val pending = initialSharedText
                          initialSharedText = null
                          result.success(pending)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          """.replace("\n          ", "\n").lstrip())
              print(f"Updated {main_kt} with MethodChannel(com.amodoro/share)")

          # 4. Generate circular Coral (#F27166) launcher icon with centered "a" in Playwrite US Trad Guides
          res_dir = Path("android/app/src/main/res")
          for xml_dir in res_dir.glob("mipmap-anydpi*"):
              shutil.rmtree(xml_dir, ignore_errors=True)

          hi_size = 1024
          hi_img = Image.new("RGBA", (hi_size, hi_size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(hi_img)
          margin = 36
          draw.ellipse(
              (margin, margin, hi_size - margin, hi_size - margin),
              fill=(242, 113, 102, 255),
          )
          font = ImageFont.truetype("/tmp/PlaywriteUSTradGuides-Regular.ttf", 520)
          bbox = draw.textbbox((0, 0), "a", font=font)
          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]
          tx = (hi_size - tw) / 2.0 - bbox[0]
          ty = (hi_size - th) / 2.0 - bbox[1] - 18
          draw.text((tx, ty), "a", font=font, fill=(255, 255, 255, 255))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, sz in sizes.items():
              target_dir = res_dir / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = hi_img.resize((sz, sz), Image.Resampling.LANCZOS)
              resized.save(target_dir / "ic_launcher.png")
              resized.save(target_dir / "ic_launcher_round.png")
          print("Generated Neo-Pastel Salmon (#F27166) 'a' launcher icons in all mipmap folders.")
          PY

      - name: Install Flutter dependencies & verify
        working-directory: amodoro_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Release APK (split-per-abi & universal)
        working-directory: amodoro_app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../amodoro-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../amodoro.apk
          ls -lh ../amodoro*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amodoro-apk
          path: |
            amodoro.apk
            amodoro-arm64.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "amodoro v1.7.0 (Sesión por dispositivo, PIN local offline, stickers y rendimiento)"
          files: |
            amodoro.apk
            amodoro-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
